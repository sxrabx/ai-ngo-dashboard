name: Daily Activity Generator

on:
  schedule:
    # Runs daily at 10:30 AM UTC
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate daily activity
        run: |
          # 75% chance of committing today
          if [ $((RANDOM % 100)) -lt 75 ]; then
            echo "Activity entry on $(date -Iseconds)" >> activity.log
            
            git config --local user.email "sxrabx@gmail.com"
            git config --local user.name "Sourabh Kumar Behera"
            
            git add -f activity.log
            
            MESSAGES=(
              "Update project configuration and dependencies"
              "Refactor core module utilities"
              "Improve logging formatting and output"
              "Optimize internal caching mechanism"
              "Fix minor typos and wording in documentation"
              "Update testing harness and mocks"
              "Clean up unused variables and imports"
              "Add minor error handling to helpers"
            )
            MSG=${MESSAGES[$((RANDOM % ${#MESSAGES[@]}))]}
            
            git commit -m "$MSG"
            git push
          else
            echo "Skipping commit today for natural variation."
          fi
